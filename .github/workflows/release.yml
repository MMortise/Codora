name: Release

# Pushing a tag like v1.2.0 builds the macOS app and publishes it as a GitHub
# release. The app's update check reads the newest release from here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Signing is optional: without these secrets the app is still built and
      # published, ad-hoc signed, and macOS asks the reader to confirm the
      # first launch.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build
        run: >
          flutter build macos --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}

      - name: Sign
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          app="build/macos/Build/Products/Release/codora.app"
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Package
        run: |
          app="build/macos/Build/Products/Release/codora.app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/Codora-${{ steps.version.outputs.name }}-macos.zip"

      - name: Notarize
        if: env.MACOS_CERTIFICATE != '' && env.NOTARY_PASSWORD != ''
        run: |
          zip="dist/Codora-${{ steps.version.outputs.name }}-macos.zip"
          xcrun notarytool submit "$zip" --wait \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"
          app="build/macos/Build/Products/Release/codora.app"
          xcrun stapler staple "$app"
          # The zip went up before the ticket existed; repack the stapled app.
          rm "$zip"
          ditto -c -k --keepParent "$app" "$zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
