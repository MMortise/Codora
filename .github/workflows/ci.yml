name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # The version .metadata was generated with; bump both together.
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # sources_live_test.dart reaches the real sites and is skipped unless
      # LIVE=true is defined, so the suite stays offline here.
      - name: Test
        run: flutter test
